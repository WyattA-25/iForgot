# Local container run for iForgot.
#   docker compose up --build
# then open http://localhost:7860/

services:
  iforgot:
    build: .
    image: iforgot:latest
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
    restart: unless-stopped
    healthcheck:
      # python is in the image; slim has no curl
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:7860/api/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # allow time to load all five models on first boot
